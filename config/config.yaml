storage: /verdaccio/storage

web:
  title: Local NPM Registry

uplinks:
  chabokan:
    url: https://mirror2.chabokan.net/npm/
    timeout: 120s

  npmjs:
    url: https://registry.npmjs.org/
    timeout: 120s

  runflare:
    url: https://mirror-npm.runflare.com
    timeout: 120s

  abrha:
    url: https://mirror.abrha.net/repository/npm/
    timeout: 120s

  liara:
    url: https://package-mirror.liara.ir/repository/npm/
    timeout: 120s

  ito:
    url: https://archive.ito.gov.ir/npm/
    timeout: 120s

  ito2:
    url: https://archive.ito.gov.ir/mirror2/npm/
    timeout: 120s

packages:
  "@*/*":
    access: $all
    proxy: npmjs

  "*":
    access: $all
    proxy: npmjs

log:
  - { type: stdout, format: pretty, level: http }